name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg-triplets/arm64-ios.cmake') }}-v5

      - name: Install dependencies for arm64-ios
        env:
          VCPKG_OSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euxo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            sdl3 sdl3-ttf "sdl3-image[core,png]" "sdl3-mixer[core]" \
            sqlite3 yaml-cpp glaze asio picosha2 libiconv fmt \
            --triplet arm64-ios \
            --overlay-triplets="$GITHUB_WORKSPACE/vcpkg-triplets" 2>&1 | tee -a build.log
          echo "--- installed libs ---"
          ls -1 "$VCPKG_ROOT/installed/arm64-ios/lib" | head -60 || true

      - name: Configure
        run: |
          set -euxo pipefail
          cmake -S src -B build-ios \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set -euxo pipefail
          cmake --build build-ios --config Release -j 4 2>&1 | tee -a build.log

      - name: Show build log tail
        if: always()
        run: |
          echo "===== build.log (last 250 lines) ====="
          tail -n 250 build.log || echo "(no build.log)"
          echo "===== artifacts on disk ====="
          find build-ios -maxdepth 4 -name "kys*" | head -20 || true
          find build-ios -name "*.app" -maxdepth 4 | head -5 || true

      - name: Compile app icon catalog
        run: |
          set -uxo pipefail
          APP=$(find build-ios -maxdepth 4 -name "kys.app" -type d | head -n 1)
          rm -rf build-ios/iconout && mkdir -p build-ios/iconout
          if timeout 240 xcrun actool ios/AppIcon.xcassets \
            --compile build-ios/iconout \
            --platform iphoneos \
            --minimum-deployment-target 14.0 \
            --app-icon AppIcon \
            --output-partial-info-plist build-ios/icon-partial.plist 2>&1 | tee -a build.log; then
            ls -la build-ios/iconout || true
            if [ -f build-ios/iconout/Assets.car ]; then
              cp build-ios/iconout/Assets.car "$APP/Assets.car"
              echo "Assets.car copied to $APP"
            else
              echo "::warning::actool produced no Assets.car"
            fi
          else
            echo "::warning::actool failed or timed out; continuing without Assets.car"
          fi

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP=$(find build-ios -maxdepth 4 -name "kys.app" -type d | head -n 1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "::error::kys.app not found"; exit 1; fi
          ls -la "$APP"
          if [ ! -f "$APP/kys" ]; then echo "::error::bundle has no executable"; exit 1; fi
          file "$APP/kys"
          mkdir -p Payload
          cp -R "$APP" Payload/
          if [ ! -f Payload/kys.app/Info.plist ]; then cp ios/Info.plist Payload/kys.app/Info.plist; fi
          mkdir -p Payload/kys.app/game
          zip -qry kys-unsigned.ipa Payload
          ls -lh kys-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kys-unsigned-ipa
          path: kys-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Publish logs to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-latest >/dev/null 2>&1 || gh release create ci-latest --title "CI latest" --notes "auto-published build log" || true
          if [ -f build.log ]; then gh release upload ci-latest build.log --clobber || true; fi
          if [ -f kys-unsigned.ipa ]; then gh release upload ci-latest kys-unsigned.ipa --clobber || true; fi



